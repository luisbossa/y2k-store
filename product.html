<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ficha de producto Inzone.">
    <title>Producto | Inzone</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <link rel="preload" href="fonts/Protomo-Outline.otf" as="font" type="font/otf" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&display=swap">

    <link rel="stylesheet" href="css/base/base.css">
    <link rel="stylesheet" href="css/components/ui.css">
    <link rel="stylesheet" href="css/components/product-card.css">
    <link rel="stylesheet" href="css/components/cart-drawer.css">
    <link rel="stylesheet" href="css/sections/header.css">
    <link rel="stylesheet" href="css/sections/footer.css">
    <link rel="stylesheet" href="css/pages/page.css">
    <link rel="stylesheet" href="css/pages/product.css">

    <script src="js/pages/product.js" type="module"></script>
</head>

<body>
    <main id="main" class="page textured-bg">
        <div class="container">
            <nav class="breadcrumb" id="breadcrumb" aria-label="Ruta de navegación"></nav>
            <div id="productRoot"></div>
        </div>

        <section class="related" id="relatedSection" aria-labelledby="relatedTitle">
            <div class="container">
                <header class="related-header">
                    <p class="section-kicker">Combínalo con</p>
                    <h2 class="section-heading" id="relatedTitle">También te puede gustar</h2>
                </header>
                <div class="product-grid" id="relatedGrid"></div>
            </div>
        </section>
    </main>
</body>

</html>
